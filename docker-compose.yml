services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./data/telegram-api:/var/lib/telegram-bot-api

  video-series:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # Local Bot API가 알려주는 절대 경로를 앱도 동일하게 읽어야 합니다.
      - ./data/telegram-api:/var/lib/telegram-bot-api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - video-series
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
